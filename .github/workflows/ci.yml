name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Fork pull requests receive GitHub's read-only token and no repository secrets.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject private session links in commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch or a force push reports an unusable base, so fall back
          # to the pushed commit alone rather than skipping the check.
          if ! git rev-parse --quiet --verify "${BASE_SHA}^{commit}" >/dev/null 2>&1; then
            BASE_SHA="${HEAD_SHA}^"
          fi
          scripts/check-private-links.sh "${BASE_SHA}..${HEAD_SHA}"

  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck:test
      - run: npm run test:coverage
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
